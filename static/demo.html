<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvoResearch · 现场演示</title>
<style>
  :root { --ink:#12100e; --muted:#6b6560; --line:#e8e4df; --bg:#faf8f5; --accent:#b45309;
          --good:#15803d; --bad:#b91c1c; --card:#fff; --blue:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1120px; margin:0 auto; padding:36px 24px 90px; }
  header h1 { font-size:30px; margin:0 0 6px; letter-spacing:-.5px; }
  header p { margin:0; color:var(--muted); }

  .stage { margin-top:26px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .stage .step { font-size:12px; color:var(--muted); border:1px solid var(--line);
                 background:var(--card); border-radius:999px; padding:6px 14px; }
  .stage .step.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .stage .step.done { border-color:var(--good); color:var(--good); }

  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line);
           padding:11px 20px; background:var(--card); color:var(--ink); transition:.15s; }
  button:hover { border-color:#c9c2ba; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; }
  button.primary:hover { background:#2b2622; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:13px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:20px; }
  .card h2 { margin:0 0 14px; font-size:13px; font-weight:700; letter-spacing:.6px;
             color:var(--muted); text-transform:uppercase; }
  .hidden { display:none !important; }

  /* 千问的思考 */
  .think { border-left:3px solid var(--accent); padding-left:16px; }
  .think .who { font-weight:700; font-size:14px; margin-bottom:6px; }
  .think .who span { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px; }
  .think p { margin:0 0 8px; }
  .think ul { margin:8px 0 0; padding-left:20px; }
  .think li { margin-bottom:4px; }

  /* 审批区 */
  .approve { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:16px 0; }
  @media (max-width:760px){ .approve { grid-template-columns:1fr; } }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field input, .field select { width:100%; padding:9px 10px; border:1px solid var(--line);
                                border-radius:8px; font:inherit; background:var(--bg); }
  .why { font-size:13px; color:var(--muted); background:var(--bg); border-radius:8px; padding:10px 12px; }

  /* 两条支线 */
  .branches { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }
  @media (max-width:820px){ .branches { grid-template-columns:1fr; } }
  .branch { border:1px solid var(--line); border-radius:12px; padding:16px; }
  .branch.jev { border-color:var(--accent); background:#fffbf5; }
  .branch.cloud { border-color:var(--blue); background:#f8faff; }
  .branch h3 { margin:0 0 8px; font-size:15px; }
  .branch .verdict { font-size:26px; font-weight:700; margin:6px 0; }
  .branch.jev .verdict { color:var(--accent); }
  .branch.cloud .verdict { color:var(--blue); }
  .branch .kv { font-size:13px; color:var(--muted); margin:3px 0; }
  .branch .kv b { color:var(--ink); font-weight:600; }

  /* 版本树 */
  .versions { display:flex; flex-direction:column; gap:8px; }
  .ver { display:grid; grid-template-columns:26px 1fr 88px 92px; align-items:center;
         gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; }
  .ver .idx { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .ver .model { font-weight:600; }
  .ver .score { font-variant-numeric:tabular-nums; font-weight:700; text-align:right; }
  .ver .state { font-size:12px; text-align:right; color:var(--muted); }
  .ver.best { border-color:var(--good); background:#f2fbf4; }
  .ver.best .state { color:var(--good); font-weight:600; }
  .ver.rolled { color:#a8a29c; }
  .ver.rolled .model, .ver.rolled .score { text-decoration:line-through; }
  .ver.rolled .state { color:var(--bad); }

  .big-number { font-size:40px; font-weight:700; letter-spacing:-1px; line-height:1.1; }
  .big-label { color:var(--muted); font-size:13px; margin-top:2px; }
  .stats { display:flex; gap:30px; flex-wrap:wrap; }

  .log { max-height:300px; overflow-y:auto; font-size:13px; }
  .log div { padding:7px 0; border-bottom:1px dashed var(--line); display:flex; gap:10px; }
  .log div:last-child { border-bottom:0; }
  .log .tag { flex:0 0 120px; color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); font-size:14px; padding:14px 0; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EvoResearch</h1>
    <p>本地千问先盘点，人审过之后才开跑 —— 该省的省，该花的才花。</p>
  </header>

  <div class="stage">
    <span class="step" id="s1">① 千问盘点</span>
    <span class="step" id="s2">② 人工审批</span>
    <span class="step" id="s3">③ 执行与分支</span>
    <button id="start" class="primary" style="margin-left:auto">开始分析</button>
  </div>

  <div class="stage" style="margin-top:10px">
    <label class="hint" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="opt-local"> 真调本地千问（慢 2 秒，更真实）
    </label>
    <label class="hint" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="opt-jev"> 真调 JEV（要 key）
    </label>
    <label class="hint" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="opt-cloud"> 真调云端（会花钱）
    </label>
  </div>

  <!-- ① 千问的思考 -->
  <section class="card hidden" id="analysis">
    <h2>千问的判断</h2>
    <div class="think">
      <div class="who" id="think-who">Tongyi Qianwen <span id="think-src"></span></div>
      <div id="think-body"></div>
    </div>
    <div class="why" id="think-why" style="margin-top:14px"></div>
  </section>

  <!-- ② 人工审批 -->
  <section class="card hidden" id="approval">
    <h2>人工审批 · 你可以改</h2>
    <p class="hint" style="margin-top:-6px">看不顺眼就改，改完才算数。点「同意」之前不会跑任何实验、不花任何 token。</p>
    <div class="approve">
      <div class="field"><label>评估指标</label>
        <select id="f-metric"><option value="f1_macro">f1_macro（整体）</option>
          <option value="f1_minority">f1_minority（少数类）</option></select></div>
      <div class="field"><label>基线模型</label>
        <select id="f-model"><option value="logistic_regression">逻辑回归</option>
          <option value="random_forest">随机森林</option>
          <option value="hist_gradient_boosting">梯度提升</option></select></div>
      <div class="field"><label>实验预算（次）</label>
        <input id="f-budget" type="number" min="1" max="6" value="3"></div>
    </div>
    <button id="approve" class="primary">同意并继续 →</button>
  </section>

  <!-- ③ 结果 + 两条支线 -->
  <section class="card hidden" id="result">
    <h2>结果</h2>
    <div class="stats">
      <div><div class="big-number" id="r-score">—</div><div class="big-label">最佳验证分数</div></div>
      <div><div class="big-number" id="r-model" style="font-size:20px">—</div><div class="big-label">最佳方案</div></div>
      <div><div class="big-number" id="r-ver" style="font-size:26px">0</div><div class="big-label">版本数</div></div>
      <div><div class="big-number" id="r-rb" style="font-size:26px">0</div><div class="big-label">回滚次数</div></div>
    </div>

    <div class="branches">
      <div class="branch jev" id="b-jev"><h3>JEV · 决策支</h3><div class="empty">等结果…</div></div>
      <div class="branch cloud" id="b-cloud"><h3>DeepSeek · 生成支</h3><div class="empty">等结果…</div></div>
    </div>
  </section>

  <section class="card hidden" id="versions-card">
    <h2>版本树 · 每一代都留档</h2>
    <div class="versions" id="versions"></div>
  </section>

  <section class="card hidden" id="log-card">
    <h2>研究过程</h2>
    <div class="log" id="log"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;

function setStep(n) {
  ['s1','s2','s3'].forEach((id, i) => {
    const el = $(id);
    el.classList.remove('on','done');
    if (i + 1 < n) el.classList.add('done');
    if (i + 1 === n) el.classList.add('on');
  });
}
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }

const IRIS = (() => {
  const rows = ['sepal_length,sepal_width,petal_length,petal_width,species'];
  const add = (a,b,c,d,s,n) => { for (let i=0;i<n;i++) rows.push(
    `${(a+i*0.02).toFixed(2)},${(b+i*0.005).toFixed(2)},${(c+i*0.01).toFixed(2)},${(d+i*0.005).toFixed(2)},${s}`); };
  add(5.0,3.4,1.4,0.2,'setosa',40);
  add(6.0,2.8,4.5,1.4,'versicolor',40);
  add(6.6,3.0,5.8,2.1,'virginica',40);
  return rows.join('\n');
})();

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

// ① 开始分析
$('start').addEventListener('click', async () => {
  const btn = $('start');
  btn.disabled = true;
  btn.textContent = '千问正在看数据…';
  setStep(1);
  hide('approval'); hide('result'); hide('versions-card'); hide('log-card');
  show('analysis');
  $('think-body').innerHTML = '<p class="hint">正在盘点：行列数、缺失、类别分布…</p>';
  try {
    const useLocal = $('opt-local').checked;
    const data = await post('/demo/analyze', {
      csv_text: IRIS, target: 'species', metric: 'f1_macro', pos_label: '1',
      use_local_model: useLocal,
    });
    sessionId = data.session_id;
    const thought = data.thought || {};
    $('think-src').textContent = thought.source === 'local_model' ? '· 本地模型' : '· 规则判断';
    const bullets = (thought.bullets || []).map((b) => `<li>${b}</li>`).join('');
    $('think-body').innerHTML = bullets
      ? `<ul>${bullets}</ul>`
      : `<p>${thought.text || ''}</p>`;
    $('think-why').innerHTML = `它建议：<b>${data.suggested.why}</b>`;

    // 填审批默认值
    $('f-metric').value = data.suggested.metric;
    $('f-model').value = data.suggested.baseline_model;
    $('f-budget').value = data.suggested.max_experiments;
    show('approval');
    setStep(2);
    btn.textContent = '重新分析';
  } catch (error) {
    $('think-body').innerHTML = `<p class="err">${error.message}</p>`;
    btn.textContent = '重试';
  } finally {
    btn.disabled = false;
  }
});

// ② 审批
$('approve').addEventListener('click', async () => {
  if (!sessionId) return;
  const btn = $('approve');
  btn.disabled = true;
  btn.textContent = '执行中…';
  setStep(3);
  try {
    await post('/demo/approve', {
      session_id: sessionId,
      overrides: {
        metric: $('f-metric').value,
        baseline_model: $('f-model').value,
        max_experiments: Number($('f-budget').value),
      },
    });
    const data = await post('/demo/execute', {
      session_id: sessionId, offline: true,
      use_jev: $('opt-jev').checked, use_cloud: $('opt-cloud').checked,
    });
    render(data);
    btn.textContent = '再跑一次';
  } catch (error) {
    alert(error.message);
    btn.textContent = '重试';
  } finally {
    btn.disabled = false;
  }
});

function render(data) {
  const s = data.summary || {};
  $('r-score').textContent = s.best_score != null ? Number(s.best_score).toFixed(4) : '—';
  $('r-model').textContent = s.best_model || '—';
  $('r-ver').textContent = s.evoundo_versions ?? 0;
  $('r-rb').textContent = s.evoundo_rollbacks ?? 0;
  show('result');

  // 两条支线
  const b = data.branches || {};
  if (b.jev) {
    $('b-jev').innerHTML = `
      <h3>JEV · 决策支 <span class="hint" style="font-weight:400;font-size:12px">${b.jev.cost}</span></h3>
      <div class="verdict">${b.jev.verdict}</div>
      <div class="kv">它在问：<b>${b.jev.question}</b></div>
      <div class="kv">依据：${b.jev.reason}</div>
      <div class="kv">看到：最好 ${b.jev.signals.best_score} · 停滞 ${b.jev.signals.stalled_rounds} 轮</div>`;
  }
  if (b.cloud) {
    $('b-cloud').innerHTML = `
      <h3>DeepSeek · 生成支 <span class="hint" style="font-weight:400;font-size:12px">${b.cloud.cost}</span></h3>
      <div class="verdict">${b.cloud.status}</div>
      <div class="kv">它在问：<b>${b.cloud.question}</b></div>
      <div class="kv">${b.cloud.reason}</div>`;
  }

  // 版本树
  const experiments = data.experiments || [];
  const best = s.best_score;
  $('versions').innerHTML = experiments.map((exp, i) => {
    const score = exp.validation_score ?? exp.validation_f1 ?? 0;
    const isBest = best != null && Math.abs(score - best) < 1e-9;
    return `<div class="ver ${isBest ? 'best' : ''}">
      <div class="idx">v${i+1}</div>
      <div class="model">${exp.model || '—'}</div>
      <div class="score">${Number(score).toFixed(4)}</div>
      <div class="state">${isBest ? '最优' : '保留'}</div></div>`;
  }).join('') || '<div class="empty">没有实验记录</div>';
  show('versions-card');

  // 事件
  const label = {analyst_profile:'Analyst 看数据', manager_plan:'Manager 定预算',
    scientist_proposal:'Scientist 提方案', experiment:'Experimenter 跑完',
    reviewer_verdict:'Reviewer 判定', rollback:'回滚', finish:'收工'};
  const events = (data.events || []).filter((e) => label[e.event]);
  $('log').innerHTML = events.map((e) => {
    let msg = '';
    if (e.event === 'analyst_profile') {
      const p = e.profile || {};
      msg = `行 ${p.rows ?? '?'} · 特征 ${p.features ?? '?'} · ${p.imbalanced ? '不平衡' : '均衡'}`;
    } else if (e.event === 'manager_plan') {
      msg = `基线 ${e.plan?.model ?? '?'}`;
    } else if (e.event === 'scientist_proposal') {
      msg = `${e.proposal?.model} · ${e.proposal?.hypothesis || ''}`;
    } else if (e.event === 'experiment') {
      msg = `${e.model} → ${Number(e.score ?? 0).toFixed(4)}（${e.duration}s）`;
    } else if (e.event === 'reviewer_verdict') {
      const v = e.verdict || {};
      msg = `${v.verdict} · Δ ${Number(v.delta ?? 0) >= 0 ? '+' : ''}${Number(v.delta ?? 0).toFixed(4)}`;
    } else if (e.event === 'rollback') {
      msg = `退回 ${e.to_version}（${e.reason}）`;
    } else if (e.event === 'finish') {
      msg = `停止：${e.summary?.stop_reason ?? '?'}`;
    }
    return `<div><span class="tag">${label[e.event]}</span><span>${msg}</span></div>`;
  }).join('');
  show('log-card');
}

setStep(1);
</script>
</body>
</html>
